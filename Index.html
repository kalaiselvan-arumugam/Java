<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Java Developer Interview Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{--bg:#fff;--card:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--accent:#10a37f}
body.dark{--bg:#0f0f0f;--card:#171717;--border:#262626;--text:#e5e5e5;--muted:#a3a3a3}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;transition:background .25s,color .25s}
input,select,textarea,button{outline:none!important;box-shadow:none!important}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input[type=checkbox]{appearance:none;width:20px;height:20px;flex:none;border:1.5px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);background-image:url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.2 4.8a1 1 0 010 1.4l-5 5a1 1 0 01-1.4 0l-2-2a1 1 0 011.4-1.4L6.5 9l4.3-4.2a1 1 0 011.4 0z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:center;background-size:14px}
.skill-select{appearance:none;min-width:70px;padding:6px 26px 6px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;font-size:14px;cursor:pointer}
.sw{position:relative;display:inline-block}.sw::after{content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px}
.acc{overflow:hidden;opacity:0;max-height:0;transition:max-height .35s,opacity .25s}
.acc.open{opacity:1;max-height:2000px}
.tc{transition:transform .15s}.tc:hover{transform:translateY(-1px)}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.ai{background:#8b5cf6;color:#fff;font-size:10px;padding:2px 6px;border-radius:99px;margin-left:8px}
</style></head>
<body class="min-h-screen flex flex-col">
<header class="sticky top-0 z-10 h-16 flex items-center justify-between px-6 border-b border-[var(--border)] bg-[var(--card)]">
<h1 class="font-semibold text-lg">Senior Java Developer Interview Tracker</h1>
<div class="flex items-center gap-3">
<input id="q" placeholder="Search..." class="px-3 py-1 bg-[var(--card)] border border-[var(--border)] rounded-lg text-sm"/>
<button onclick="openAll(1)" title="Expand all" class="p-2 hover:bg-[var(--border)] rounded-lg"><span class="material-symbols-outlined">unfold_more</span></button>
<button onclick="openAll(0)" title="Collapse all" class="p-2 hover:bg-[var(--border)] rounded-lg"><span class="material-symbols-outlined">unfold_less</span></button>
<button onclick="toggleTheme()" class="p-2 hover:bg-[var(--border)] rounded-lg"><span id="ti" class="material-symbols-outlined">dark_mode</span></button>
<button onclick="exportData()" class="p-2 hover:bg-[var(--border)] rounded-lg"><span class="material-symbols-outlined">download</span></button>
<input hidden id="imp" type="file" onchange="importData(event)">
<button onclick="imp.click()" class="p-2 hover:bg-[var(--border)] rounded-lg"><span class="material-symbols-outlined">upload</span></button>
</div></header>
<main class="flex-1 p-4 md:p-8">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
<div class="bg-[var(--card)] border border-[var(--border)] p-5 rounded-xl"><p class="text-sm text-[var(--muted)]">Overall Progress</p><p id="p1" class="text-2xl font-semibold mt-2">0%</p></div>
<div class="bg-[var(--card)] border border-[var(--border)] p-5 rounded-xl"><p class="text-sm text-[var(--muted)]">Subtopics Done</p><p id="p2" class="text-2xl font-semibold mt-2">0</p></div>
<div class="bg-[var(--card)] border border-[var(--border)] p-5 rounded-xl"><p class="text-sm text-[var(--muted)]">Total Topics</p><p id="p3" class="text-2xl font-semibold mt-2">0</p></div>
<div class="bg-[var(--card)] border border-[var(--border)] p-5 rounded-xl"><p class="text-sm text-[var(--muted)]">Avg Skill Level</p><p id="p4" class="text-2xl font-semibold mt-2">0</p></div>
</div>
<div id="content" class="space-y-6"></div>
</main>

const roadmap=[];
RAW.trim().split("\n").forEach(l=>{
 if(l.startsWith("## ")){roadmap.push({week:l.slice(3),topics:[]});return;}
 let ai=l.startsWith("*");if(ai)l=l.slice(1);
 const [n,s]=l.split("|");
 roadmap[roadmap.length-1].topics.push({name:n,ai,subs:s.split(";")});
});
const fresh=()=>roadmap.map(w=>({week:w.week,topics:w.topics.map(t=>({name:t.name,ai:t.ai,level:1,notes:"",open:false,subs:t.subs.map(s=>({name:s,done:false}))}))}));
let data=fresh();
try{const sv=JSON.parse(localStorage.getItem(STORAGE));if(sv&&sv.length)data=sv;}catch(e){}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(e){}}
function render(){
 const c=document.getElementById("content");c.innerHTML="";
 const q=document.getElementById("q").value.toLowerCase();
 data.forEach((w,wi)=>{
  let d=0,t=0;w.topics.forEach(x=>x.subs.forEach(s=>{t++;if(s.done)d++;}));
  const wd=document.createElement("div");
  wd.className="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5";
  wd.innerHTML=`<div class="flex justify-between items-center mb-2"><h2 class="font-semibold">${w.week}</h2><span class="text-xs text-[var(--muted)]">${d}/${t}</span></div><div class="bar mb-4"><i style="width:${t?d/t*100:0}%"></i></div>`;
  let shown=0;
  w.topics.forEach((t,ti)=>{
   if(q&&!match(t,q))return;shown++;
   const td=document.createElement("div");td.className="tc border border-[var(--border)] rounded-lg mb-3";
   const all=t.subs.length&&t.subs.every(s=>s.done);
   const h=document.createElement("div");h.className="flex justify-between items-center p-4 cursor-pointer";
   h.innerHTML=`<div class="flex items-center gap-3"><span class="material-symbols-outlined">${t.open||q?"expand_more":"chevron_right"}</span><span class="${all?'text-green-500 font-semibold':''}">${t.name}</span>${t.ai?'<span class="ai">AI</span>':''}<span class="text-xs text-[var(--muted)]">${t.subs.filter(s=>s.done).length}/${t.subs.length}</span></div><div class="flex items-center gap-2"><label class="text-xs text-[var(--muted)]">Skill</label><div class="sw"><select class="skill-select" onchange="updateLevel(${wi},${ti},this.value)">${[1,2,3,4,5].map(n=>`<option ${t.level==n?'selected':''}>${n}</option>`).join("")}</select></div></div>`;
   h.onclick=e=>{if(e.target.tagName==="SELECT")return;t.open=!t.open;save();render();};
   td.appendChild(h);
   const b=document.createElement("div");b.className="acc px-6 pb-4 space-y-3"+(t.open||q?" open":"");
   t.subs.forEach((s,si)=>{b.innerHTML+=`<label class="flex items-center gap-4 text-base"><input type="checkbox" ${s.done?"checked":""} onchange="toggleSub(${wi},${ti},${si})"><span>${s.name}</span></label>`;});
   const n=document.createElement("textarea");n.className="w-full bg-[var(--card)] border border-[var(--border)] rounded p-3 text-sm";n.placeholder="Notes...";n.value=t.notes;
   n.onchange=()=>{t.notes=n.value;save();};b.appendChild(n);
   td.appendChild(b);wd.appendChild(td);
  });
  if(shown)c.appendChild(wd);
 });
 updateStats();
}
function match(t,q){return t.name.toLowerCase().includes(q)||t.notes.toLowerCase().includes(q)||t.subs.some(s=>s.name.toLowerCase().includes(q));}
function toggleSub(w,t,s){const x=data[w].topics[t].subs[s];x.done=!x.done;save();render();}
function updateLevel(w,t,v){data[w].topics[t].level=parseInt(v);save();updateStats();}
function openAll(v){data.forEach(w=>w.topics.forEach(t=>t.open=!!v));save();render();}
function updateStats(){
 let tot=0,done=0,tp=0,ls=0;
 data.forEach(w=>w.topics.forEach(t=>{tp++;ls+=t.level;t.subs.forEach(s=>{tot++;if(s.done)done++;});}));
